# npm trusted publishing with provenance (V1 A6). A template: copy it to .github/workflows/release.yml when
# Minte enables publishing (DECISIONS 27). Even then it starts only by hand (workflow_dispatch),
# after the @morphkit scope exists and each package has this repository + workflow registered as its trusted
# publisher on npmjs.com (docs/RELEASING.md). No NPM_TOKEN secret is used or needed.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and verify only, do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install -g npm@^11.5.1 # trusted publishing needs npm 11.5.1+
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Publish the MIT packages
        run: |
          for pkg in runtime vite-plugin ui agent cli; do
            (cd packages/$pkg && pnpm pack --pack-destination ../../.release && \
              if [ "${{ inputs.dry_run }}" != "true" ]; then npm publish ../../.release/morphkit-$pkg-*.tgz --provenance --access public; fi)
          done
