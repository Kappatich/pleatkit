# demo.pleatkit.com, step 1 of 2 (docs/demo-hosting.md): port 80 only, so certbot can get the certificate.
# Copy to /etc/nginx/sites-available/demo.pleatkit.com.conf, link it into sites-enabled, `nginx -t && systemctl reload nginx`,
# run certbot, then replace this file with demo.pleatkit.com.conf.
server {
    listen 80;
    listen [::]:80;
    server_name demo.pleatkit.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 404;
    }
}
