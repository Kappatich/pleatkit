# demo.pleatkit.com: the public pleatkit demo (docs/demo-hosting.md). Copy by hand to
# /etc/nginx/sites-available/demo.pleatkit.com.conf (link it into sites-enabled), then `nginx -t && systemctl reload nginx`.
# Touches nothing of the other sites: its own server_name, its own zone and log format names (pkdemo_*).

# behind Cloudflare the visitor's address is in CF-Connecting-IP; it only keys rate limits (hashed with a daily salt
# inside the demo, never stored)
map $http_cf_connecting_ip $pkdemo_client {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $pkdemo_client zone=pkdemo_req:10m rate=20r/s;
limit_conn_zone $pkdemo_client zone=pkdemo_conn:10m;
# no addresses in the access log
log_format pkdemo_noip '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name demo.pleatkit.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://demo.pleatkit.com$request_uri;
    }
}

server {
    # nginx 1.24: `http2` on the listen line (it does not know `http2 on;`)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.pleatkit.com;

    ssl_certificate     /etc/letsencrypt/live/demo.pleatkit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.pleatkit.com/privkey.pem;

    access_log /var/log/nginx/demo.pleatkit.com.access.log pkdemo_noip;
    error_log  /var/log/nginx/demo.pleatkit.com.error.log crit;

    # the app sets CSP, X-Frame-Options, nosniff, Referrer-Policy and Permissions-Policy itself; HSTS here
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;
    client_body_timeout 15s;
    limit_conn pkdemo_conn 20;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        limit_req zone=pkdemo_req burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8710;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Demo-Client-IP $pkdemo_client;
        # agent answers stream as server-sent events (a heartbeat every 15 s)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
    }
}
